  internal_semestercourse.CreateRequest:
    properties:
      course_id:
        type: integer
      schedules:
        items:
          $ref: '#/definitions/internal_semestercourse.Schedule'
        type: array
      section:
        type: string
      semester_id:
        type: integer
      taught_by:
        type: integer
    type: object
  internal_semestercourse.CreateResponse:
    properties:
      course_id:
        type: integer
      schedules:
        items:
          $ref: '#/definitions/internal_semestercourse.Schedule'
