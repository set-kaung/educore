definitions:
  educore_internal_openlibrary.BookDoc:
    properties:
      author_name:
        items:
          type: string
        type: array
      cover_i:
        type: integer
      first_publish_year:
        type: integer
      isbn:
        items:
          type: string
        type: array
      key:
        type: string
      title:
        type: string
    type: object
  educore_internal_openlibrary.SearchResult:
    properties:
      docs:
        items:
          $ref: '#/definitions/educore_internal_openlibrary.BookDoc'
        type: array
      numFound:
        type: integer
    type: object
  internal.ResponseBody:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
      status_code:
        type: integer
    type: object
  internal_auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  internal_auth.LoginResult:
    properties:
      token:
        type: string
    type: object
  internal_course.CourseRequest:
    properties:
      course_code:
        type: string
      name:
        type: string
    type: object
  internal_course.CourseResponse:
    properties:
      course_code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  internal_semestercourse.CourseOffering:
    properties:
      course_code:
        type: string
      name:
        type: string
      professor_name:
        type: string
      section:
        type: string
      semester:
        type: string
    type: object
  internal_semestercourse.CreateRequest:
    properties:
      course_id:
        type: integer
      schedules:
        items:
          $ref: '#/definitions/internal_semestercourse.Schedule'
        type: array
      section:
        type: string
      semester:
        type: string
      taught_by:
        type: integer
    type: object
  internal_semestercourse.CreateResponse:
    properties:
      course_id:
        type: integer
      schedules:
        items:
          $ref: '#/definitions/internal_semestercourse.Schedule'
        type: array
      section:
        type: string
      semester:
        type: string
      semester_course_id:
        type: integer
      taught_by:
        type: integer
    type: object
  internal_semestercourse.Schedule:
    properties:
      from:
        type: string
      to:
        type: string
    type: object
  internal_student.StudentData:
    properties:
      department_name:
        type: string
      student_id:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Course-registration backend for CSX 4110.
  title: EduCore API
  version: "1.0"
paths:
  /courses:
    post:
      consumes:
      - application/json
      description: Add a new course listing. Professor only.
      parameters:
      - description: Course details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_course.CourseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_course.CourseResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Create a new course
      tags:
      - courses
  /health:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Health check
  /login:
    post:
      consumes:
      - application/json
      description: Authenticate with username and password, returns JWT
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.LoginResult'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Log in
      tags:
      - auth
  /semester-courses:
    get:
      description: Get all course offerings for a given semester
      parameters:
      - description: Semester (e.g. Fall2026)
        in: query
        name: semester
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_semestercourse.CourseOffering'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: List semester course offerings
      tags:
      - semester-courses
    post:
      consumes:
      - application/json
      description: Schedule a course for a semester with sections and timeslots. Checks
        professor conflicts.
      parameters:
      - description: Semester course details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_semestercourse.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_semestercourse.CreateResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Create semester course schedule
      tags:
      - semester-courses
  /student:
    get:
      description: Get all students with department names
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_student.StudentData'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List students
      tags:
      - students
  /textbooks:
    get:
      description: Search for textbooks via OpenLibrary API
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/educore_internal_openlibrary.SearchResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Search textbooks
      tags:
      - textbooks
schemes:
- http
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
