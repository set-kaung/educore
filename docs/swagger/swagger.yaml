    type: object
  educore_internal_openlibrary.SearchResult:
    properties:
      docs:
        items:
          $ref: '#/definitions/educore_internal_openlibrary.BookDoc'
        type: array
      numFound:
        type: integer
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
