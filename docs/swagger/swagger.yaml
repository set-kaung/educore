host: localhost:8080
info:
  contact: {}
  description: Course-registration backend for CSX 4110.
  title: EduCore API
  version: "1.0"
paths:
  /admin/api-keys:
    post:
      consumes:
      - application/json
      description: 'Admin only: generate and issue a new API key for peer service
        integration.'
      parameters:
      - description: Partner details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_publicapi.GrantKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_publicapi.GrantKeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Grant a new API key
      tags:
      - admin
  /admin/api-keys/{key}:
    delete:
      description: 'Admin only: revoke an existing API key by its key string.'
      parameters:
      - description: API key to revoke
        in: path
        name: key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.ResponseBody'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Revoke an API key
      tags:
      - admin
  /api/courses:
    get:
      description: Get all course listings
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal.Course'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List courses
      tags:
      - courses
    post:
      consumes:
      - application/json
      description: Add a new course listing. Professor only.
      parameters:
      - description: Course details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_course.CourseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_course.CourseResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Create a new course
      tags:
      - courses
  /api/departments:
    get:
      description: Get all departments, seeding a default set when none exist
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_department.DepartmentData'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: List departments
      tags:
      - departments
  /api/logout:
    post:
      description: Clears the session cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Log out
      tags:
      - auth
  /api/my/courses:
    get:
      description: Get all course offerings the current student is enrolled in
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_semestercourse.CourseOffering'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List the authenticated student's enrolled courses
      tags:
      - semester-courses
  /api/professors:
    get:
      description: Get all professors by name
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_professor.ProfessorData'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List professors
      tags:
      - professors
  /api/semester-courses:
    get:
      description: Get all course offerings for a given semester
      parameters:
      - description: Semester ID
        in: query
        name: semester_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_semestercourse.CourseOffering'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: List semester course offerings
      tags:
      - semester-courses
    post:
      consumes:
      - application/json
      description: Schedule a course for a semester with sections and timeslots. Checks
        professor conflicts.
      parameters:
      - description: Semester course details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_semestercourse.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_semestercourse.CreateResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Create semester course schedule
      tags:
      - semester-courses
  /api/semester-courses/{id}/enroll:
    post:
      description: Enroll the authenticated student in a semester course offering.
        Rejects duplicate enrollment and schedule conflicts with courses the student
        is already enrolled in.
      parameters:
      - description: Semester course ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_semestercourse.EnrollResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ResponseBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Enroll in a course offering
      tags:
      - semester-courses
  /api/semesters:
    get:
      description: Get all semesters, with the current one flagged
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_semesters.SemesterData'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List semesters
      tags:
      - semesters
  /api/session:
    get:
      description: Returns the authenticated user's id and role based on the session
        cookie or bearer token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.Claims'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - BearerAuth: []
      summary: Current session
      tags:
      - auth
  /api/setup:
    post:
      consumes:
      - application/json
      description: Create the Student account for the authenticated directory user
        and issue a session. Requires a setup token.
      parameters:
      - description: Account details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.SetupRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.SetupResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal.ResponseBody'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Complete account setup
      tags:
      - auth
  /api/setup/context:
    get:
      description: Prefill data (email, suggested name) for first-time account setup.
        Requires a setup token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_auth.SetupContext'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Account setup context
      tags:
      - auth
  /api/students:
    get:
      description: Get all students with department names, optionally filtered by
        name, ID or department. Professor or admin only.
      parameters:
      - description: Filter by name, ID or department
        in: query
        name: q
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_student.StudentData'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: List students
      tags:
      - students
  /api/textbooks:
    get:
      description: Search for textbooks via OpenLibrary API
      parameters:
      - description: Search query
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/educore_internal_openlibrary.SearchResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Search textbooks
      tags:
      - textbooks
  /health:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      summary: Health check
  /public/students/{student_id}/departments/{department_name}:
    get:
      description: 'Peer API: verify whether a student belongs to a specific department.
        Requires x-api-key header.'
      parameters:
      - description: Student ID
        in: path
        name: student_id
        required: true
        type: string
      - description: Department name
        in: path
        name: department_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal.ResponseBody'
            - properties:
                data:
                  $ref: '#/definitions/internal_publicapi.VerifyDepartmentResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal.ResponseBody'
      security:
      - ApiKeyAuth: []
      summary: Verify student department enrollment
      tags:
      - public-api
schemes:
- http
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: x-api-key
    type: apiKey
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
