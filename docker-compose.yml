services:
  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: educore
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-proot", "-e", "SELECT 1"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  app:
    build: .
    restart: on-failure
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "root:root@tcp(db:3306)/educore?parseTime=true"
      JWT_SECRET: "secret123"
      AUTH_TYPE: "mock"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
