{{define "content"}}
<div class="page-header">
    <h1>Students</h1>
    <span class="empty">{{len .Data.Students}} shown</span>
</div>
<input type="search"
       name="q"
       value="{{.Data.Query}}"
       placeholder="Filter by name, ID or department…"
       hx-get="/students/search"
       hx-trigger="input changed delay:300ms, search"
       hx-target="#student-rows">
<table class="table">
    <thead>
    <tr>
        <th>Username</th>
        <th>Student ID</th>
        <th>Department</th>
    </tr>
    </thead>
    <tbody id="student-rows">
    {{template "student_rows" .Data.Students}}
    </tbody>
</table>
{{end}}
