<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Course · EduCore</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/helpers.css">
</head>
<body data-page="add-course">
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/">EduCore</a>
        <nav id="nav" class="site-nav" hidden>
            <a class="nav-link" href="/course-offerings" data-page="course-offerings">Course Offerings</a>
            <a class="nav-link" href="/my-courses" data-page="my-courses" data-role="student">My Courses</a>
            <a class="nav-link" href="/students" data-page="students" data-role="professor admin">Students</a>
            <a class="nav-link" href="/add-course" data-page="add-course" data-role="professor admin">Add Course</a>
            <a class="nav-link" href="/add-offering" data-page="add-offering" data-role="professor admin">Add Offering</a>
        </nav>
        <div class="user-menu">
            <span id="role-badge" class="role-badge" hidden></span>
            <button id="logout-btn" type="button" class="btn btn-link" hidden>Log out</button>
        </div>
    </div>
</header>
<main class="page">
    <div class="page-header">
        <h1 class="page-title">Add Course</h1>
        <span id="course-count" class="page-count"></span>
    </div>

    <p id="course-error" class="form-error max-w-md" hidden></p>

    <form id="course-form" class="card max-w-md form-stack">
        <div>
            <label class="field-label" for="name">Course Name</label>
            <input class="field" type="text" id="name" name="name"
                   placeholder="e.g. Introduction to Computer Science" required>
        </div>
        <div>
            <label class="field-label" for="course_code">Course Code</label>
            <input class="field" type="text" id="course_code" name="course_code"
                   placeholder="e.g. CS101" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Course</button>
    </form>

    <h2 class="section-title">Existing Courses</h2>
    <table class="table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Code</th>
        </tr>
        </thead>
        <tbody id="course-rows">
        <tr>
            <td colspan="2" class="empty-row">Loading courses…</td>
        </tr>
        </tbody>
    </table>
</main>
<script type="module" src="/js/add-course.js"></script>
</body>
</html>
