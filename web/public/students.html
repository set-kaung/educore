<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students · EduCore</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/helpers.css">
</head>
<body data-page="students">
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/">EduCore</a>
        <nav id="nav" class="site-nav" hidden>
            <a class="nav-link" href="/course-offerings" data-page="course-offerings">Course Offerings</a>
            <a class="nav-link" href="/my-courses" data-page="my-courses" data-role="student">My Courses</a>
            <a class="nav-link" href="/students" data-page="students" data-role="professor admin">Students</a>
            <a class="nav-link" href="/add-course" data-page="add-course" data-role="professor admin">Add Course</a>
            <a class="nav-link" href="/add-offering" data-page="add-offering" data-role="professor admin">Add Offering</a>
        </nav>
        <div class="user-menu">
            <span id="role-badge" class="role-badge" hidden></span>
            <button id="logout-btn" type="button" class="btn btn-link" hidden>Log out</button>
        </div>
    </div>
</header>
<main class="page">
    <div class="page-header">
        <h1 class="page-title">Students</h1>
        <span id="student-count" class="page-count"></span>
    </div>

    <input class="field max-w-md" type="search" name="q"
           placeholder="Filter by name, ID or department…">

    <table class="table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Student ID</th>
            <th>Department</th>
        </tr>
        </thead>
        <tbody id="student-rows">
        <tr>
            <td colspan="3" class="empty-row">Loading students…</td>
        </tr>
        </tbody>
    </table>
</main>
<script type="module" src="/js/students.js"></script>
</body>
</html>
