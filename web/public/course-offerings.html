<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Offerings · EduCore</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/helpers.css">
    <script src="/js/vendor/htmx.min.js" defer></script>
    <script src="/js/vendor/mustache.min.js" defer></script>
    <script src="/js/vendor/client-side-templates.js" defer></script>
</head>
<body data-page="course-offerings">
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/">EduCore</a>
        <nav id="nav" class="site-nav" hidden>
            <a class="nav-link" href="/course-offerings" data-page="course-offerings">Course Offerings</a>
            <a class="nav-link" href="/my-courses" data-page="my-courses" data-role="student">My Courses</a>
            <a class="nav-link" href="/students" data-page="students" data-role="professor admin">Students</a>
            <a class="nav-link" href="/add-course" data-page="add-course" data-role="professor admin">Add Course</a>
            <a class="nav-link" href="/add-offering" data-page="add-offering" data-role="professor admin">Add Offering</a>
        </nav>
        <div class="user-menu">
            <span id="role-badge" class="role-badge" hidden></span>
            <button id="logout-btn" type="button" class="btn btn-link" hidden>Log out</button>
        </div>
    </div>
</header>
<main class="page"
      hx-ext="client-side-templates">
    <div class="page-header">
        <h1 class="page-title">Course Offerings</h1>
        <span id="offering-count" class="page-count"></span>
    </div>

    <label class="field-label max-w-xs mt-2" for="semester">Semester</label>
    <select id="semester" name="semester" class="field max-w-xs" autocomplete="off"
            hx-get="/api/semester-courses"
            hx-trigger="change"
            hx-target="#offering-rows"
            mustache-template="tpl-offering-rows">
        <option value="">Loading semesters…</option>
    </select>

    <table class="table">
        <thead>
        <tr>
            <th>Course</th>
            <th>Code</th>
            <th>Section</th>
            <th>Professor</th>
        </tr>
        </thead>
        <tbody id="offering-rows">
        <tr>
            <td colspan="4" class="empty-row">Select a semester.</td>
        </tr>
        </tbody>
    </table>

    <template id="tpl-offering-rows">
        {{#data}}
        <tr>
            <td>{{name}}</td>
            <td>{{course_code}}</td>
            <td>{{section}}</td>
            <td>{{professor_name}}</td>
        </tr>
        {{/data}}
        {{^data}}
        <tr>
            <td colspan="4" class="empty-row">No offerings for this semester yet.</td>
        </tr>
        {{/data}}
    </template>
</main>
<script type="module">
    import { initPage } from "/js/app.js";

    await initPage({});

    const select = document.getElementById("semester");
    const count = document.getElementById("offering-count");

    document.body.addEventListener("htmx:afterSwap", (evt) => {
        if (evt.target.id !== "offering-rows") return;
        const empty = document.querySelector("#offering-rows .empty-row");
        count.textContent = empty ? "" : `${document.querySelectorAll("#offering-rows tr").length} offerings`;
    });

    const loadSemesters = async () => {
        try {
            const res = await fetch("/api/semesters", { credentials: "same-origin" });
            const body = await res.json();
            if (!res.ok) throw new Error(body.message);

            select.innerHTML = "";
            for (const semester of body.data) {
                select.append(new Option(semester, semester));
            }
            if (body.data.length) {
                select.value = body.data[0];
                htmx.trigger(select, "change");
            } else {
                select.innerHTML = '<option value="">No semesters yet</option>';
            }
        } catch (err) {
            select.innerHTML = '<option value="">Failed to load semesters</option>';
            console.error(err);
        }
    };
    loadSemesters();
</script>
</body>
</html>
