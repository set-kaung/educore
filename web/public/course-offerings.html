<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course Offerings · EduCore</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/helpers.css">
</head>
<body data-page="course-offerings">
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="./"><img class="brand-logo" src="logo.png" alt="EduCore logo">EduCore</a>
        <nav id="nav" class="site-nav" hidden>
            <a class="nav-link" href="course-offerings" data-page="course-offerings">Course Offerings</a>
            <a class="nav-link" href="my-courses" data-page="my-courses" data-role="student">My Courses</a>
            <a class="nav-link" href="students" data-page="students" data-role="professor admin">Students</a>
            <div class="nav-dropdown" data-role="professor admin">
                <button class="nav-dropdown-btn" type="button">Manage <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.23 7.21a.75.75 0 011.06.02L10 11.168l3.71-3.938a.75.75 0 111.08 1.04l-4.25 4.5a.75.75 0 01-1.08 0l-4.25-4.5a.75.75 0 01.02-1.06z" clip-rule="evenodd"/></svg></button>
                <div class="nav-dropdown-menu">
                    <a class="nav-dropdown-item" href="add-course" data-page="add-course">Add Course</a>
                    <a class="nav-dropdown-item" href="add-offering" data-page="add-offering">Add Offering</a>
                    <a class="nav-dropdown-item" href="recommended-books" data-page="recommended-books">Recommended Books</a>
                </div>
            </div>
        </nav>
        <div class="user-menu">
            <span id="role-badge" class="role-badge" hidden></span>
            <button id="logout-btn" type="button" class="btn btn-link" hidden>Log out</button>
        </div>
    </div>
</header>
<main class="page">
    <div class="page-header">
        <h1 class="page-title">Course Offerings</h1>
        <span id="offering-count" class="page-count"></span>
    </div>

    <label class="field-label max-w-xs mt-2" for="semester">Semester</label>
    <select id="semester" name="semester" class="field max-w-xs" autocomplete="off">
        <option value="">Loading semesters…</option>
    </select>

    <table class="table">
        <thead>
        <tr>
            <th>Course</th>
            <th>Code</th>
            <th>Section</th>
            <th>Professor</th>
            <th>Schedule</th>
            <th id="enroll-col" hidden></th>
            <th id="action-col" hidden>Actions</th>
        </tr>
        </thead>
        <tbody id="offering-rows">
        <tr>
            <td colspan="6" class="empty-row">Select a semester.</td>
        </tr>
        </tbody>
    </table>
</main>
<script type="module" src="js/course-offerings.js"></script>
</body>
</html>
