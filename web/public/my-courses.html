<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Courses · EduCore</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <link rel="stylesheet" href="/css/helpers.css">
    <script src="/js/vendor/htmx.min.js" defer></script>
    <script src="/js/vendor/mustache.min.js" defer></script>
    <script src="/js/vendor/client-side-templates.js" defer></script>
</head>
<body data-page="my-courses">
<header class="topbar">
    <div class="topbar-inner">
        <a class="brand" href="/">EduCore</a>
        <nav id="nav" class="site-nav" hidden>
            <a class="nav-link" href="/course-offerings" data-page="course-offerings">Course Offerings</a>
            <a class="nav-link" href="/my-courses" data-page="my-courses" data-role="student">My Courses</a>
            <a class="nav-link" href="/students" data-page="students" data-role="professor admin">Students</a>
            <a class="nav-link" href="/add-course" data-page="add-course" data-role="professor admin">Add Course</a>
            <a class="nav-link" href="/add-offering" data-page="add-offering" data-role="professor admin">Add Offering</a>
        </nav>
        <div class="user-menu">
            <span id="role-badge" class="role-badge" hidden></span>
            <button id="logout-btn" type="button" class="btn btn-link" hidden>Log out</button>
        </div>
    </div>
</header>
<main class="page"
      hx-ext="client-side-templates">
    <div class="page-header">
        <h1 class="page-title">My Courses</h1>
        <span id="course-count" class="page-count"></span>
    </div>

    <table class="table">
        <thead>
        <tr>
            <th>Course</th>
            <th>Code</th>
            <th>Section</th>
            <th>Semester</th>
            <th>Professor</th>
        </tr>
        </thead>
        <tbody id="course-rows"
               hx-get="/api/my/courses"
               hx-trigger="load"
               hx-target="this"
               mustache-template="tpl-course-rows">
        </tbody>
    </table>

    <template id="tpl-course-rows">
        {{#data}}
        <tr>
            <td>{{name}}</td>
            <td>{{course_code}}</td>
            <td>{{section}}</td>
            <td>{{semester}}</td>
            <td>{{professor_name}}</td>
        </tr>
        {{/data}}
        {{^data}}
        <tr>
            <td colspan="5" class="empty-row">You are not enrolled in any courses.</td>
        </tr>
        {{/data}}
    </template>
</main>
<script type="module">
    import { initPage } from "/js/app.js";

    await initPage({});

    const count = document.getElementById("course-count");
    document.body.addEventListener("htmx:afterSwap", (evt) => {
        if (evt.target.id !== "course-rows") return;
        const empty = document.querySelector("#course-rows .empty-row");
        count.textContent = empty ? "" : `${document.querySelectorAll("#course-rows tr").length} enrolled`;
    });
</script>
</body>
</html>
